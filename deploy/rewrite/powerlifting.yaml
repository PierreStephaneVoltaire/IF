apiVersion: v1
kind: Service
metadata:
  name: pl-program
  namespace: if-portals
spec:
  selector:
    app: pl-program
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pl-program
  namespace: if-portals
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: pl-program
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: program
        image: if-powerlifting-services:rewrite
        imagePullPolicy: IfNotPresent
        env:
        - name: PL_DOMAIN
          value: program
        - name: IF_API_URL
          value: http://if-agent-api:8000
        - name: AWS_SHARED_CREDENTIALS_FILE
          value: /secrets/aws/credentials
        - name: AWS_CONFIG_FILE
          value: /secrets/aws/config
        envFrom:
        - secretRef:
            name: powerlifting-app-secrets
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
        volumeMounts:
        - name: aws
          mountPath: /secrets/aws
          readOnly: true
      volumes:
      - name: aws
        secret:
          secretName: pl-aws-credentials
---
