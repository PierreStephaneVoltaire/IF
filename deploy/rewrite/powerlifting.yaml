    app: pl-analytics
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pl-analytics
  namespace: if-portals
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: pl-analytics
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: analytics
        image: if-powerlifting-services:rewrite
        imagePullPolicy: IfNotPresent
        env:
        - name: PL_DOMAIN
          value: analytics
        - name: IF_API_URL
          value: http://if-agent-api:8000
        - name: AWS_SHARED_CREDENTIALS_FILE
          value: /secrets/aws/credentials
        - name: AWS_CONFIG_FILE
          value: /secrets/aws/config
        - name: ANALYTICS_NODE_URL
          value: http://127.0.0.1:8091
        envFrom:
        - secretRef:
            name: powerlifting-app-secrets
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
        volumeMounts:
        - name: aws
          mountPath: /secrets/aws
          readOnly: true
      - name: reports
        image: if-powerlifting-analytics:rewrite
        imagePullPolicy: IfNotPresent
        env:
        - name: ANALYTICS_NODE_PORT
          value: '8091'
        - name: IF_API_URL
          value: http://if-agent-api:8000
        - name: AWS_SHARED_CREDENTIALS_FILE
          value: /secrets/aws/credentials
        - name: AWS_CONFIG_FILE
          value: /secrets/aws/config
        envFrom:
        - secretRef:
            name: powerlifting-app-secrets
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: aws
          mountPath: /secrets/aws
          readOnly: true
      volumes:
      - name: aws
        secret:
          secretName: pl-aws-credentials
---
